<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إتمام الشراء — خمسة ديجيتال</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .co-wrap{max-width:540px;margin:30px auto 56px;padding:0 18px}
  .co-product{display:flex;gap:16px;align-items:center;background:#fff;border-radius:var(--r);
    border:1px solid var(--line);box-shadow:var(--shadow-soft);padding:16px;margin-bottom:18px}
  .co-product img{width:92px;height:92px;border-radius:14px;object-fit:cover;flex:none}
  .co-product h1{font-size:1.12rem;margin:0 0 4px;letter-spacing:-.02em;line-height:1.5}
  .co-product .price{font-size:1.2rem}
  .back{display:inline-flex;align-items:center;gap:6px;margin:10px 0 16px;
    color:var(--teal);font-weight:700;font-size:.94rem}
  .back:hover{opacity:.75}
  .trust{text-align:center;color:var(--grey);font-size:.82rem;margin-top:14px;line-height:1.9}
  .code-row{display:flex;gap:8px;align-items:stretch}
  .code-row input{flex:1;text-transform:uppercase}
  .code-row .btn{white-space:nowrap;padding-inline:18px}
  .code-msg{min-height:20px;margin:6px 0 0;font-size:.88rem;font-weight:700}
  .code-msg.ok{color:#1F6E6B}
  .code-msg.err{color:#B3261E}
  .was{text-decoration:line-through;opacity:.5;font-weight:400;margin-inline-start:8px;font-size:.9rem}
  .badge-off{background:var(--gold);color:#3a2c00;border-radius:99px;padding:2px 10px;
    font-size:.76rem;font-weight:800;margin-inline-start:8px}
  .dl-item{background:var(--teal-soft);border-radius:14px;padding:13px 16px;margin:10px 0;
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

  /* فاصل «أو» بين وسيلتَي الدفع */
  .or{display:flex;align-items:center;gap:14px;margin:20px 0 4px;
    color:var(--grey);font-size:.82rem;font-weight:700}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

  /* صندوق تمارا */
  .tamara-box{border:1.5px solid rgba(107,33,168,.22);background:var(--tamara-l);
    border-radius:16px;padding:16px;margin-top:12px}
  .tamara-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .tamara-head img{height:24px;width:auto}
  .tamara-head b{font-size:.98rem;letter-spacing:-.01em}
  .tamara-sub{color:#6B4E86;font-size:.85rem;margin-bottom:12px}
  .tamara-box label{display:block;font-weight:700;font-size:.85rem;color:#5B3E76;margin-bottom:5px}
  .tamara-box input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid rgba(107,33,168,.2);
    font-family:inherit;font-size:1rem;background:#fff;color:var(--ink);direction:ltr;text-align:right}
  .tamara-box input:focus{outline:none;border-color:var(--tamara);
    box-shadow:0 0 0 3px rgba(107,33,168,.13)}
  .btn-tamara{background:var(--tamara);color:#fff;width:100%;margin-top:12px;
    box-shadow:0 6px 18px rgba(107,33,168,.26)}
  .btn-tamara:hover{background:#581C87;transform:translateY(-2px)}
  .tamara-note{color:var(--grey);font-size:.84rem;text-align:center;margin-top:14px;
    display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
  .tamara-note img{height:17px;width:auto;opacity:.85}
  .tamara-msg{min-height:20px;font-size:.86rem;font-weight:700;color:#B3261E;margin-top:8px}
</style>
</head>
<body>
<div class="co-wrap">
  <a href="/" class="back">→ الرجوع للمتجر</a>
  <div class="co-product" id="co-product"></div>

  <div class="panel" id="email-step">
    <h2>📧 إيميلك (توصلك عليه الملفات فوراً)</h2>
    <label for="co-email">الإيميل</label>
    <input type="email" id="co-email" placeholder="you@email.com" required autocomplete="email">

    <label for="co-code" style="margin-top:14px">كود الخصم (اختياري)</label>
    <div class="code-row">
      <input type="text" id="co-code" placeholder="مثال: WELCOME20" autocomplete="off"
             inputmode="latin" maxlength="24">
      <button class="btn btn-ghost" id="co-apply" type="button">تطبيق</button>
    </div>
    <p class="code-msg" id="co-code-msg"></p>

    <div class="row-actions">
      <button class="btn btn-primary btn-block" id="co-continue">متابعة للدفع الآمن 🔒</button>
    </div>
    <p class="result err" id="co-msg"></p>

    <!-- خيار تمارا — يظهر فقط إذا كان المبلغ ضمن حدودها -->
    <div id="tamara-slot"></div>

    <div id="co-files"></div>

    <div class="pays" id="pay-marks">
      <span class="pay-chip">مدى</span>
      <span class="pay-chip">Apple Pay</span>
      <span class="pay-chip">فيزا / ماستركارد</span>
    </div>
    <p class="trust">دفع آمن عبر بوابة مرخصة من البنك المركزي السعودي 🇸🇦<br>
    ملفاتك تصلك تلقائياً خلال ثوانٍ من إتمام الدفع<br>
    <a href="/policies" style="color:var(--teal)">الشروط وسياسة الاسترجاع</a></p>
  </div>
</div>

<script>
let WHATSAPP = "966548133555";

const PRODUCTS = {
  "interactive":  {name:"البلانر العربي التفاعلي (GoodNotes)", price:79, img:"p01.jpg"},
  "budget":       {name:"ميزانيتي الذكية (إكسل)", price:49, img:"p02.jpg"},
  "daily":        {name:"بلانر الإنجاز اليومي (طباعة)", price:39, img:"p03.jpg"},
  "cv":           {name:"حقيبة السيرة الذاتية (ATS)", price:29, img:"p04.jpg"},
  "letters":      {name:"كراسة الحروف والأرقام", price:19, img:"p05.jpg"},
  "numbers20":    {name:"كراسة الأرقام من ١ إلى ٢٠", price:19, img:"p06.jpg"},
  "words":        {name:"كراسة كلماتي الأولى", price:19, img:"p07.jpg"},
  "shapes":       {name:"كراسة الأشكال والألوان", price:19, img:"p08.jpg"},
  "animals":      {name:"كراسة تلوين الحيوانات", price:19, img:"p09.jpg"},
  "story":        {name:"قصة أرنوب والحروف الضائعة", price:29, img:"p10.jpg"},
  "mazes":        {name:"كراسة المتاهات", price:19, img:"p11.jpg"},
  "hunt":         {name:"لعبة البحث عن الحرف", price:19, img:"p12.jpg"},
  "cards":        {name:"بطاقات الحروف والأرقام", price:29, img:"p13.jpg"},
  "stars":        {name:"لوحة نجوم المهام", price:29, img:"p14.jpg"},
  "ramadan":      {name:"حقيبة رمضان للأطفال", price:29, img:"p15.jpg"},
  "bundle-tasees":     {name:"حقيبة التأسيس", price:49, img:"b01.jpg"},
  "bundle-tasliya":    {name:"حقيبة التسلية", price:49, img:"b02.jpg"},
  "bundle-library":    {name:"مكتبة طفلي الكاملة", price:99, img:"b03.jpg"},
  "bundle-adults":     {name:"حقيبة التنظيم للكبار", price:99, img:"b04.jpg"},
  "bundle-everything": {name:"باقة كل شيء (المتجر كاملاً)", price:149, img:"b05.jpg"},
};

const key = new URLSearchParams(location.search).get("p");
const product = PRODUCTS[key];
const box = document.getElementById("co-product");

// حالة الخصم — النسخة الموثوقة منها في السيرفر دائماً؛ هذه للعرض فقط
let discount = { code: "", percent: 0, price: product ? product.price : 0, free: false };

// تتبع الإعلانات — لا يُحمَّل إلا إذا حفظ المالك معرّفاته في لوحة الأدمن
function loadTracking(t){
  if (!t || (!t.gadsId && !t.ga4Id)) return;
  const s = document.createElement("script");
  s.async = true;
  s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(t.gadsId || t.ga4Id);
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = window.gtag || function(){ dataLayer.push(arguments); };
  gtag("js", new Date());
  if (t.gadsId) gtag("config", t.gadsId);
  if (t.ga4Id) gtag("config", t.ga4Id);
  // «بدأ خطوة الدفع» — تفيد حملات إعادة الاستهداف وقياس التسرب قبل الدفع
  if (product) {
    gtag("event", "begin_checkout", {
      currency: "SAR", value: discount.price,
      items: [{ item_id: key, item_name: product.name, price: discount.price, quantity: 1 }],
    });
  }
}

// رقم الواتساب قابل للتغيير من لوحة المالك
fetch("/api/settings").then(r => r.json()).then(s => {
  if (s && s.whatsapp) WHATSAPP = s.whatsapp;
  loadTracking(s && s.tracking);
}).catch(function () {});

function renderProduct() {
  if (!product) return;
  const off = discount.percent > 0;
  box.innerHTML = '<img src="/products/' + product.img + '" alt="">' +
    '<div><h1>' + product.name + '</h1><div class="price">' +
      (discount.free
        ? '<b style="color:#1F6E6B">مجاني</b><span class="was">' + product.price + ' ر.س</span>'
        : '<b>' + discount.price + '</b> ر.س' +
          (off ? '<span class="was">' + product.price + ' ر.س</span>' : '')) +
      (off ? '<span class="badge-off">خصم ' + discount.percent + '%</span>' : '') +
      '<div style="font-size:.85rem;color:var(--grey);margin-top:2px">' +
        (discount.free ? 'تحميل فوري — بدون دفع' : 'تحميل فوري بعد الدفع') +
      '</div></div></div>';
}

if (!product) {
  box.innerHTML = "<div><h1>المنتج غير موجود</h1><p><a href='/' style='color:var(--teal)'>ارجع للمتجر واختر منتجاً</a></p></div>";
  document.getElementById("email-step").style.display = "none";
} else {
  renderProduct();
}

function setContinueLabel() {
  const btn = document.getElementById("co-continue");
  btn.textContent = discount.free ? "احصل على ملفاتك مجاناً 🎁" : "متابعة للدفع الآمن 🔒";
}

function readEmail(msgEl) {
  const email = document.getElementById("co-email").value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
    msgEl.textContent = "اكتب إيميلاً صحيحاً — عليه توصلك الملفات";
    document.getElementById("co-email").focus();
    return "";
  }
  msgEl.textContent = "";
  return email;
}

/* ═══════════ تمارا — قسّمها على دفعات ═══════════
   الحدود تختلف من تاجر لآخر، فنسأل السيرفر عنها بدل افتراضها.
   لو كان سعر المنتج تحت الحد الأدنى نعرض ملاحظة بدل زر يفشل عند الضغط. */
const tamaraSlot = document.getElementById("tamara-slot");

async function refreshTamara() {
  tamaraSlot.innerHTML = "";
  if (!product || discount.free) return;
  let d;
  try {
    d = await (await fetch("/api/tamara?op=config&amount=" + discount.price)).json();
  } catch (e) { return; }
  if (!d || !d.enabled) return;

  if (!d.available) {
    tamaraSlot.innerHTML =
      '<p class="tamara-note"><img src="/pay/tamara.svg" alt="تمارا">' +
      'التقسيط متاح للطلبات من ' + d.min + ' ر.س — جرّب إحدى الحزم 🎁</p>';
    return;
  }

  const n = d.instalments || 4;
  const per = (discount.price / n).toFixed(2).replace(/\.00$/, "");
  tamaraSlot.innerHTML =
    '<div class="or">أو</div>' +
    '<div class="tamara-box">' +
      '<div class="tamara-head"><img src="/pay/tamara.svg" alt="تمارا">' +
        '<b>قسّمها على ' + n + ' دفعات</b></div>' +
      '<p class="tamara-sub">' + per + ' ر.س شهرياً — بدون فوائد وبدون رسوم تأخير</p>' +
      '<label for="tm-phone">رقم جوالك (تطلبه تمارا للتحقق)</label>' +
      '<input type="tel" id="tm-phone" placeholder="05XXXXXXXX" inputmode="tel" maxlength="15" autocomplete="tel">' +
      '<button class="btn btn-tamara" id="tm-btn">ادفع بالتقسيط عبر تمارا</button>' +
      '<p class="tamara-msg" id="tm-msg"></p>' +
    '</div>';

  document.getElementById("tm-btn").addEventListener("click", payWithTamara);
}

async function payWithTamara() {
  const btn = document.getElementById("tm-btn");
  const msg = document.getElementById("tm-msg");
  const phone = document.getElementById("tm-phone").value.trim();
  msg.textContent = "";

  const email = readEmail(msg);
  if (!email) return;
  if (!/^(?:\+?966|0)?5\d{8}$/.test(phone.replace(/[\s-]/g, ""))) {
    msg.textContent = "اكتب رقم جوال سعودي صحيح — مثال: 0512345678"; return;
  }

  btn.disabled = true; btn.textContent = "جاري فتح تمارا..";
  try {
    const r = await fetch("/api/tamara?op=start", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        productKey: key, email: email, phone: phone, code: discount.code,
        isMobile: window.matchMedia("(max-width:768px)").matches,
      })
    });
    const d = await r.json().catch(function () { return {}; });
    if (r.ok && d.url) { location.href = d.url; return; }
    msg.textContent = d.error || "تعذّر فتح تمارا — جرب البطاقة";
  } catch (e) {
    msg.textContent = "تعذّر الاتصال بتمارا — جرب البطاقة";
  }
  btn.disabled = false; btn.textContent = "ادفع بالتقسيط عبر تمارا";
}

// شارة تمارا ضمن وسائل الدفع المعروضة
fetch("/api/tamara?op=config").then(r => r.json()).then(d => {
  if (d && d.enabled) {
    const img = document.createElement("img");
    img.src = "/pay/tamara.svg"; img.alt = "تمارا"; img.className = "pay-logo";
    document.getElementById("pay-marks").appendChild(img);
  }
}).catch(function () {});

/* ═══════════ كود الخصم ═══════════ */
document.getElementById("co-apply").addEventListener("click", async () => {
  const input = document.getElementById("co-code");
  const msg = document.getElementById("co-code-msg");
  const btn = document.getElementById("co-apply");
  const code = input.value.trim().toUpperCase();
  input.value = code;

  if (!code) {
    discount = { code: "", percent: 0, price: product.price, free: false };
    msg.textContent = ""; msg.className = "code-msg";
    renderProduct(); setContinueLabel(); refreshTamara();
    return;
  }

  btn.disabled = true; btn.textContent = "..";
  try {
    const r = await fetch("/api/check-discount", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: code, productKey: key })
    });
    const d = await r.json();
    if (d.ok) {
      discount = { code: d.code, percent: d.percent, price: d.price, free: d.free };
      msg.textContent = d.free
        ? "🎁 خصم 100% — المنتج مجاني بالكامل"
        : "✅ تم تطبيق خصم " + d.percent + "% — تدفع " + d.price + " ر.س بدل " + d.original;
      msg.className = "code-msg ok";
    } else {
      discount = { code: "", percent: 0, price: product.price, free: false };
      msg.textContent = "✕ " + (d.reason || d.error || "الكود غير صحيح");
      msg.className = "code-msg err";
    }
  } catch (e) {
    msg.textContent = "تعذّر التحقق من الكود"; msg.className = "code-msg err";
  }
  renderProduct(); setContinueLabel(); refreshTamara();
  btn.disabled = false; btn.textContent = "تطبيق";
});

document.getElementById("co-code").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); document.getElementById("co-apply").click(); }
});

/* ═══════════ الدفع بالبطاقة / الطلب المجاني ═══════════ */
document.getElementById("co-continue").addEventListener("click", async () => {
  const btn = document.getElementById("co-continue");
  const msg = document.getElementById("co-msg");
  const email = readEmail(msg);
  if (!email) return;
  btn.disabled = true; btn.textContent = "جاري تجهيز الدفع..";

  // بديل مضمون: مهما صار، العميل يقدر يكمل طلبه بواتساب
  const wa = "https://wa.me/" + WHATSAPP + "?text=" +
    encodeURIComponent("مرحباً 👋 أبغى أطلب: " + product.name + " (" + discount.price + " ر.س)" +
      (discount.code ? "\nكود الخصم: " + discount.code + " (" + discount.percent + "%)" : "") +
      "\nإيميلي: " + email);
  const fallback = function (reason) {
    msg.innerHTML = reason +
      '<br><a class="btn btn-wa" style="margin-top:10px" href="' + wa + '" target="_blank" rel="noopener">أكمل الطلب عبر واتساب 💬</a>';
  };

  try {
    // خصم 100%: لا توجد فاتورة تُدفع — مسار مستقل يسلّم الملفات مباشرة
    if (discount.free) {
      btn.textContent = "جاري تجهيز ملفاتك..";
      const r = await fetch("/api/free-order", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ productKey: key, email: email, code: discount.code })
      });
      const d = await r.json().catch(function () { return {}; });
      if (r.ok && d.ok) {
        document.getElementById("co-msg").textContent = "";
        document.getElementById("co-files").innerHTML =
          '<div style="text-align:center;margin-top:18px"><div style="font-size:2.4rem">🎉</div>' +
          '<h2 style="margin:6px 0">ملفاتك جاهزة!</h2>' +
          '<p style="color:var(--grey);font-size:.9rem">وأرسلنا نسخة إلى <b dir="ltr">' + email + '</b></p></div>' +
          d.links.map(function (l) {
            return '<div class="dl-item"><b>📄 ' + l.label + '</b>' +
                   '<a class="btn btn-sm" href="' + l.url + '">⬇️ تحميل</a></div>';
          }).join("") +
          '<p style="color:var(--grey);font-size:.82rem;text-align:center">الروابط صالحة 7 أيام — حمّلها واحفظها.</p>';
        document.getElementById("co-continue").style.display = "none";
        document.getElementById("co-apply").disabled = true;
        return;
      }
      fallback(d.error || "تعذّر تجهيز الملفات");
      btn.disabled = false; setContinueLabel();
      return;
    }

    const r = await fetch("/api/pay-start", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ productKey: key, email: email, code: discount.code })
    });
    const d = await r.json().catch(function () { return {}; });
    if (r.ok && d.url) { location.href = d.url; return; }
    fallback(d.error || "تعذر فتح صفحة الدفع");
  } catch (e) {
    fallback("تعذر الاتصال بصفحة الدفع");
  }
  btn.disabled = false; setContinueLabel();
});

if (product) refreshTamara();
</script>
</body>
</html>
