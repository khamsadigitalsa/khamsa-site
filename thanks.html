<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شكراً لطلبك — خمسة ديجيتال</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .th-wrap{max-width:560px;margin:40px auto;padding:0 18px;text-align:center}
  .th-icon{font-size:4rem}
  .dl-list{text-align:right;margin-top:18px}
  .dl-item{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:14px 18px;margin:10px 0;
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .dl-item b{font-size:.95rem}
  .spin{color:var(--grey);font-weight:700}
</style>
</head>
<body>
<div class="th-wrap">
  <div id="content">
    <div class="th-icon">⏳</div>
    <h1 class="spin">لحظات.. نتحقق من دفعتك</h1>
  </div>
</div>

<script>
const qs = new URLSearchParams(location.search);
const id = qs.get("id");                                    // ميسر
const transactionNo = qs.get("transactionNo") || qs.get("transactionNo".toLowerCase()); // Paylink
const ref = transactionNo || id;
const content = document.getElementById("content");

function waHelp(text){
  return "https://wa.me/966548133555?text=" + encodeURIComponent(text);
}

async function run(){
  if (!ref) {
    content.innerHTML = '<div class="th-icon">💚</div><h1>شكراً لك!</h1><p>ارجع <a href="/" style="color:var(--teal)">للمتجر</a> أو كلمنا واتساب لأي استفسار.</p>';
    return;
  }
  try {
    const r = await fetch("/api/verify-pay", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(transactionNo ? { transactionNo } : { id })
    });
    const d = await r.json();
    if (!r.ok) {
      content.innerHTML = '<div class="th-icon">😕</div><h1>ما اكتمل الدفع</h1>' +
        '<p>' + (d.error || "") + (d.message ? " — " + d.message : "") + '</p>' +
        '<p><a class="btn btn-primary" href="/">جرب مرة ثانية</a> ' +
        '<a class="btn btn-ghost" href="' + waHelp("مرحباً، واجهت مشكلة في الدفع — رقم العملية: " + ref) + '">كلمنا واتساب</a></p>';
      return;
    }
    let list = d.links.map(l =>
      '<div class="dl-item"><b>📄 ' + l.label + '</b>' +
      '<a class="btn btn-sm" href="' + l.url + '">⬇️ تحميل</a></div>').join("");
    content.innerHTML =
      '<div class="th-icon">🎉</div><h1>تم الدفع — ملفاتك جاهزة!</h1>' +
      '<p>طلبك: <b>' + d.name + '</b>' + (d.emailed ? '<br>وأرسلنا نسخة من الروابط إلى <b dir="ltr">' + d.email + '</b> 📧' : '') + '</p>' +
      '<div class="dl-list">' + list + '</div>' +
      '<p style="color:var(--grey);font-size:.85rem">الروابط صالحة 7 أيام — حمّل ملفاتك واحفظها. أي مشكلة؟ <a style="color:var(--teal)" href="' + waHelp("مرحباً، عندي استفسار عن طلبي رقم: " + ref) + '">كلمنا واتساب</a></p>' +
      '<a class="btn btn-gold" href="/#products">🛍️ أكمل التسوق</a>';
  } catch (e) {
    content.innerHTML = '<div class="th-icon">😕</div><h1>تعذر التحقق</h1><p><a class="btn btn-primary" href="javascript:location.reload()">أعد المحاولة</a></p>';
  }
}
run();
</script>
</body>
</html>
